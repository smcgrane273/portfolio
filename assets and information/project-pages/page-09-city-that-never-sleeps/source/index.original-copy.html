<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>City That Never Sleeps</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #07132a;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
    <script>
      const WINDOW_OFF = '#2B2B2B';
      const WINDOW_ON = '#FFD54A';

      let buildings = [];
      let skyColor;
      let canvasEl;
      let recorder = null;
      let recordChunks = [];
      let isRecording = false;
      const RECORD_MS = 5000;

      function setup() {
        canvasEl = createCanvas(windowWidth, windowHeight);
        noStroke();
        skyColor = color(7, 19, 42);
        buildCity();
      }

      function buildCity() {
        buildings = [];
        const baseY = height * 0.9;
        const count = 6;
        for (let i = 0; i < count; i++) {
          const depth = map(i, 0, count - 1, 1.0, 0.6);
          const w = width * random(0.18, 0.32) * depth;
          const h = height * random(0.35, 0.7) * depth;
          const x = random(-width * 0.05, width * 0.95);
          const y = baseY - h;
          const b = new Building(x, y, w, h, depth);
          buildings.push(b);
        }
        buildings.sort((a, b) => a.depth - b.depth);
      }

      class Building {
        constructor(x, y, w, h, depth) {
          this.x = x;
          this.y = y;
          this.w = w;
          this.h = h;
          this.depth = depth;

          this.windowPadding = max(3, floor(6 * depth));
          this.windowW = max(6, floor(10 * depth));
          this.windowH = max(6, floor(12 * depth));
          this.windowGapX = max(4, floor(8 * depth));
          this.windowGapY = max(5, floor(10 * depth));

          this.windows = [];
          this.initWindows();
        }

        initWindows() {
          this.windows = [];
          const cols = floor((this.w - this.windowPadding * 2 + this.windowGapX) / (this.windowW + this.windowGapX));
          const rows = floor((this.h - this.windowPadding * 2 + this.windowGapY) / (this.windowH + this.windowGapY));
          const startX = this.x + (this.w - (cols * this.windowW + (cols - 1) * this.windowGapX)) / 2;
          const startY = this.y + (this.h - (rows * this.windowH + (rows - 1) * this.windowGapY)) / 2;

          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const wx = startX + c * (this.windowW + this.windowGapX);
              const wy = startY + r * (this.windowH + this.windowGapY);
              const win = {
                x: wx,
                y: wy,
                w: this.windowW,
                h: this.windowH,
                value: random() < 0.12 ? 1 : 0,
                target: random() < 0.12 ? 1 : 0,
                nextToggle: millis() + random(4000, 14000),
                speed: random(0.01, 0.04)
              };
              this.windows.push(win);
            }
          }
        }

        update() {
          const now = millis();
          for (const win of this.windows) {
            if (now > win.nextToggle) {
              win.target = win.target === 1 ? 0 : 1;
              win.nextToggle = now + random(6000, 20000);
              win.speed = random(0.01, 0.04);
            }
            win.value += (win.target - win.value) * win.speed;
          }
        }

        draw() {
          fill(0, 0, 0);
          rect(this.x, this.y, this.w, this.h);

          for (const win of this.windows) {
            const c = lerpColor(color(WINDOW_OFF), color(WINDOW_ON), win.value);
            fill(c);
            rect(win.x, win.y, win.w, win.h);
          }
        }

        toggleWindowAt(mx, my) {
          for (const win of this.windows) {
            if (mx >= win.x && mx <= win.x + win.w && my >= win.y && my <= win.y + win.h) {
              win.target = win.target === 1 ? 0 : 1;
              return true;
            }
          }
          return false;
        }
      }

      function draw() {
        background(skyColor);

        drawMoon();

        for (const b of buildings) {
          b.update();
          b.draw();
        }
      }

      function drawMoon() {
        const mx = width * 0.78;
        const my = height * 0.2;
        const r = min(width, height) * 0.08;
        fill(230, 235, 255);
        ellipse(mx, my, r, r);
      }

      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        buildCity();
      }

      function doubleClicked() {
        if (isOnMoon(mouseX, mouseY)) {
          startRecording();
          return false;
        }

        for (let i = buildings.length - 1; i >= 0; i--) {
          if (buildings[i].toggleWindowAt(mouseX, mouseY)) {
            break;
          }
        }
        return false;
      }

      function isOnMoon(px, py) {
        const mx = width * 0.78;
        const my = height * 0.2;
        const r = min(width, height) * 0.08;
        return dist(px, py, mx, my) <= r * 0.5;
      }

      function startRecording() {
        if (isRecording || !canvasEl) return;
        const stream = canvasEl.elt.captureStream(60);
        recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
        recordChunks = [];
        recorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordChunks.push(e.data);
        };
        recorder.onstop = saveRecording;
        recorder.start();
        isRecording = true;

        setTimeout(() => {
          if (recorder && recorder.state !== 'inactive') recorder.stop();
          isRecording = false;
        }, RECORD_MS);
      }

      function saveRecording() {
        const blob = new Blob(recordChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'city-that-never-sleeps-5s.webm';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
    </script>
  </body>
</html>
